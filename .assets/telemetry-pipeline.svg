<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171d27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2231a"/>
      <stop offset="1" stop-color="#ff6b4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9aa8ba"/>
    </marker>
    <style>
      .title { font: 700 31px Segoe UI, Arial, sans-serif; fill: #f5f7fa; }
      .subtitle { font: 400 16px Segoe UI, Arial, sans-serif; fill: #aab7c8; }
      .label { font: 700 17px Segoe UI, Arial, sans-serif; fill: #f5f7fa; }
      .body { font: 400 14px Segoe UI, Arial, sans-serif; fill: #c4cfdd; }
      .small { font: 400 13px Segoe UI, Arial, sans-serif; fill: #aab7c8; }
      .box { fill: #1b232e; stroke: #344355; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .parallel { fill: #141b24; stroke: #55677d; stroke-width: 1.5; rx: 16; }
      .arrow { stroke: #9aa8ba; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .accent { fill: url(#accent); }
      .ok { fill: #35c98b; }
      .line { stroke: #3a4758; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1500" height="980" fill="url(#bg)"/>
  <text x="70" y="70" class="title">LOQ Control · Telemetry Pipeline</text>
  <text x="70" y="101" class="subtitle">Non-blocking acquisition with parallel sensor stages, bounded caching, and smooth UI updates</text>
  <rect x="70" y="125" width="1360" height="2" fill="url(#accent)"/>

  <rect x="560" y="155" width="380" height="76" class="box"/>
  <rect x="560" y="155" width="8" height="76" class="accent" rx="4"/>
  <text x="750" y="187" text-anchor="middle" class="label">Telemetry tick</text>
  <text x="750" y="212" text-anchor="middle" class="body">Timer requests a fresh reading</text>

  <path d="M750 231 V270" class="arrow"/>
  <rect x="500" y="270" width="500" height="78" class="box"/>
  <text x="750" y="302" text-anchor="middle" class="label">Read gate + short cache</text>
  <text x="750" y="327" text-anchor="middle" class="body">Avoid overlapping reads and reuse samples younger than 250 ms</text>

  <path d="M750 348 V386" class="arrow"/>
  <rect x="100" y="386" width="1300" height="370" class="parallel"/>
  <text x="750" y="420" text-anchor="middle" class="label">Parallel acquisition stages · off the WPF UI thread</text>
  <text x="750" y="445" text-anchor="middle" class="small">Independent hardware sources run concurrently; each stage preserves unavailable values as null</text>

  <rect x="135" y="480" width="270" height="190" class="box"/>
  <rect x="135" y="480" width="270" height="8" class="accent" rx="4"/>
  <text x="270" y="520" text-anchor="middle" class="label">Lenovo firmware</text>
  <text x="160" y="555" class="body">• CPU/GPU temperature</text>
  <text x="160" y="582" class="body">• CPU/GPU fan RPM</text>
  <text x="160" y="609" class="body">• Safe WMI feature reads</text>
  <text x="160" y="642" class="small">Invalid/sentinel RPM values rejected</text>

  <rect x="435" y="480" width="270" height="190" class="box"/>
  <rect x="435" y="480" width="270" height="8" fill="#4c9aff" rx="4"/>
  <text x="570" y="520" text-anchor="middle" class="label">CPU metrics</text>
  <text x="460" y="555" class="body">• Utilization sample</text>
  <text x="460" y="582" class="body">• Live frequency counter</text>
  <text x="460" y="609" class="body">• Boost performance × max clock</text>
  <text x="460" y="642" class="small">No static CurrentClockSpeed primary</text>

  <rect x="765" y="480" width="270" height="190" class="box"/>
  <rect x="765" y="480" width="270" height="8" fill="#8c6cff" rx="4"/>
  <text x="900" y="520" text-anchor="middle" class="label">GPU metrics</text>
  <text x="790" y="555" class="body">• GPU utilization</text>
  <text x="790" y="582" class="body">• NVIDIA current clock</text>
  <text x="790" y="609" class="body">• LHM fallback when needed</text>
  <text x="790" y="642" class="small">Hardware source remains truthful</text>

  <rect x="1065" y="480" width="270" height="190" class="box"/>
  <rect x="1065" y="480" width="270" height="8" fill="#e2a83b" rx="4"/>
  <text x="1200" y="520" text-anchor="middle" class="label">System metrics</text>
  <text x="1090" y="555" class="body">• Memory utilization</text>
  <text x="1090" y="582" class="body">• Battery percentage</text>
  <text x="1090" y="609" class="body">• Charging state</text>
  <text x="1090" y="642" class="small">Optional values may be unavailable</text>

  <path d="M270 670 V725 H750 V780" class="arrow"/>
  <path d="M570 670 V725 H750 V780" class="arrow"/>
  <path d="M900 670 V725 H750 V780" class="arrow"/>
  <path d="M1200 670 V725 H750 V780" class="arrow"/>

  <rect x="480" y="780" width="540" height="78" class="box"/>
  <rect x="480" y="780" width="8" height="78" class="ok" rx="4"/>
  <text x="750" y="812" text-anchor="middle" class="label">Merge SensorReading</text>
  <text x="750" y="837" text-anchor="middle" class="body">Combine current values, timestamp, and truthful unavailable fields</text>

  <path d="M750 858 V895" class="arrow"/>
  <rect x="270" y="895" width="960" height="55" class="box"/>
  <text x="750" y="929" text-anchor="middle" class="label">Cache result → update dashboard/fan page smoothly → show “Last updated”</text>

  <text x="70" y="940" class="small">Safety principle: no artificial CPU/RAM workload · no unsafe EC writes · no fake telemetry</text>
</svg>
