<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1360" viewBox="0 0 1500 1360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171d27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2231a"/>
      <stop offset="1" stop-color="#ff6b4a"/>
    </linearGradient>
    <linearGradient id="speculative" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49391d"/>
      <stop offset="1" stop-color="#30291f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9aa8ba"/>
    </marker>
    <marker id="branch" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e2a83b"/>
    </marker>
    <style>
      .title { font: 700 31px Segoe UI, Arial, sans-serif; fill: #f5f7fa; }
      .subtitle { font: 400 16px Segoe UI, Arial, sans-serif; fill: #aab7c8; }
      .label { font: 700 16px Segoe UI, Arial, sans-serif; fill: #f5f7fa; }
      .body { font: 400 14px Segoe UI, Arial, sans-serif; fill: #c4cfdd; }
      .small { font: 400 13px Segoe UI, Arial, sans-serif; fill: #aab7c8; }
      .box { fill: #1b232e; stroke: #344355; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .spec { fill: url(#speculative); stroke: #a77c32; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .lane { fill: #141b24; stroke: #344355; stroke-width: 1.5; rx: 16; }
      .arrow { stroke: #9aa8ba; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .branchArrow { stroke: #e2a83b; stroke-width: 2.5; fill: none; marker-end: url(#branch); }
      .accent { fill: url(#accent); }
      .blue { fill: #4c9aff; }
      .green { fill: #35c98b; }
      .gold { fill: #e2a83b; }
      .red { fill: #ed6259; }
      .line { stroke: #3a4758; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1500" height="1360" fill="url(#bg)"/>
  <text x="70" y="70" class="title">CPU Instruction Prefetch &amp; Execution Pipeline</text>
  <text x="70" y="101" class="subtitle">CPU instructions overlap in hardware · example below follows one LOQ Control telemetry refresh</text>
  <rect x="70" y="125" width="1360" height="2" fill="url(#accent)"/>

  <rect x="70" y="155" width="260" height="86" class="box"/>
  <rect x="70" y="155" width="8" height="86" class="blue" rx="4"/>
  <text x="200" y="188" text-anchor="middle" class="label">Program / thread</text>
  <text x="200" y="215" text-anchor="middle" class="body">Instruction stream + current PC</text>

  <path d="M330 198 H365" class="arrow"/>
  <rect x="365" y="155" width="280" height="86" class="box"/>
  <rect x="365" y="155" width="8" height="86" class="blue" rx="4"/>
  <text x="505" y="188" text-anchor="middle" class="label">Fetch &amp; prefetch</text>
  <text x="505" y="215" text-anchor="middle" class="body">Fetch bytes; predict likely next addresses</text>

  <path d="M645 198 H680" class="arrow"/>
  <rect x="680" y="155" width="260" height="86" class="box"/>
  <rect x="680" y="155" width="8" height="86" class="blue" rx="4"/>
  <text x="810" y="188" text-anchor="middle" class="label">Decode</text>
  <text x="810" y="215" text-anchor="middle" class="body">Identify operations and dependencies</text>

  <path d="M940 198 H975" class="arrow"/>
  <rect x="975" y="155" width="260" height="86" class="box"/>
  <rect x="975" y="155" width="8" height="86" class="blue" rx="4"/>
  <text x="1105" y="188" text-anchor="middle" class="label">Schedule / dispatch</text>
  <text x="1105" y="215" text-anchor="middle" class="body">Ready operations go to execution units</text>

  <path d="M1235 198 H1270" class="arrow"/>
  <rect x="1270" y="155" width="170" height="86" class="box"/>
  <rect x="1270" y="155" width="8" height="86" class="green" rx="4"/>
  <text x="1355" y="188" text-anchor="middle" class="label">Retire</text>
  <text x="1355" y="215" text-anchor="middle" class="body">Commit in order</text>

  <rect x="70" y="285" width="1370" height="280" class="lane"/>
  <text x="100" y="321" class="label">Branch prediction and speculative path</text>
  <text x="100" y="346" class="small">The CPU may work ahead before a branch result is known; speculative results are not committed until validated.</text>

  <rect x="105" y="380" width="260" height="110" class="box"/>
  <text x="235" y="417" text-anchor="middle" class="label">Branch instruction</text>
  <text x="235" y="445" text-anchor="middle" class="body">“If condition, go to A;</text>
  <text x="235" y="468" text-anchor="middle" class="body">otherwise continue to B”</text>

  <path d="M365 435 H430" class="branchArrow"/>
  <rect x="430" y="380" width="250" height="110" class="spec"/>
  <text x="555" y="417" text-anchor="middle" class="label">Predict next path</text>
  <text x="555" y="445" text-anchor="middle" class="body">Branch predictor selects A or B</text>
  <text x="555" y="468" text-anchor="middle" class="small">Prediction may be right or wrong</text>

  <path d="M680 435 H740" class="branchArrow"/>
  <rect x="740" y="365" width="285" height="88" class="spec"/>
  <text x="882" y="399" text-anchor="middle" class="label">Speculative instructions</text>
  <text x="882" y="427" text-anchor="middle" class="body">Fetch, decode, and execute predicted work</text>

  <path d="M1025 407 H1090" class="arrow"/>
  <rect x="1090" y="365" width="290" height="88" class="box"/>
  <text x="1235" y="399" text-anchor="middle" class="label">Branch resolves</text>
  <text x="1235" y="427" text-anchor="middle" class="body">Actual condition / target becomes known</text>

  <path d="M1090 438 C1060 480 1038 500 1005 510" class="branchArrow"/>
  <rect x="740" y="475" width="285" height="68" class="box"/>
  <text x="882" y="504" text-anchor="middle" class="label">Prediction correct</text>
  <text x="882" y="528" text-anchor="middle" class="small">Keep results; retire in program order</text>

  <path d="M1235 453 V510 H1110" class="branchArrow"/>
  <rect x="1090" y="475" width="290" height="68" class="spec"/>
  <text x="1235" y="504" text-anchor="middle" class="label">Prediction wrong</text>
  <text x="1235" y="528" text-anchor="middle" class="small">Discard younger work; fetch correct path</text>

  <path d="M1090 510 H1050 V435 H1025" class="branchArrow"/>
  <text x="1078" y="487" text-anchor="end" class="small">redirect</text>

  <rect x="70" y="610" width="1370" height="330" class="lane"/>
  <text x="100" y="648" class="label">One LOQ Control telemetry refresh · application-level cycle (not one CPU clock cycle)</text>
  <text x="100" y="675" class="small">Fan page polls about once per second; each refresh contains many millions of CPU clock cycles.</text>

  <rect x="100" y="720" width="205" height="135" class="box"/>
  <text x="202" y="758" text-anchor="middle" class="label">1 · Timer tick</text>
  <text x="202" y="789" text-anchor="middle" class="body">Request next sample</text>
  <text x="202" y="817" text-anchor="middle" class="small">~1 second interval</text>

  <path d="M305 787 H337" class="arrow"/>
  <rect x="337" y="720" width="220" height="135" class="box"/>
  <text x="447" y="758" text-anchor="middle" class="label">2 · Read gate/cache</text>
  <text x="447" y="789" text-anchor="middle" class="body">Reuse a very recent read</text>
  <text x="447" y="817" text-anchor="middle" class="small">Avoid duplicate overlap</text>

  <path d="M557 787 H589" class="arrow"/>
  <rect x="589" y="705" width="330" height="165" class="spec"/>
  <text x="754" y="743" text-anchor="middle" class="label">3 · Read sensors in parallel</text>
  <text x="615" y="778" class="body">CPU: load + live clock counter</text>
  <text x="615" y="806" class="body">GPU: utilization + NVIDIA/LHM clock</text>
  <text x="615" y="834" class="body">Lenovo: temperatures + fan RPM</text>
  <text x="615" y="858" class="small">System: memory + battery</text>

  <path d="M919 787 H951" class="arrow"/>
  <rect x="951" y="720" width="205" height="135" class="box"/>
  <text x="1053" y="758" text-anchor="middle" class="label">4 · Merge reading</text>
  <text x="1053" y="789" text-anchor="middle" class="body">Join values + timestamp</text>
  <text x="1053" y="817" text-anchor="middle" class="small">Unavailable stays unavailable</text>

  <path d="M1156 787 H1188" class="arrow"/>
  <rect x="1188" y="720" width="220" height="135" class="box"/>
  <text x="1298" y="758" text-anchor="middle" class="label">5 · Update UI</text>
  <text x="1298" y="789" text-anchor="middle" class="body">Animate metrics smoothly</text>
  <text x="1298" y="817" text-anchor="middle" class="small">Refresh “Last updated”</text>

  <text x="100" y="906" class="small">CPU instructions execute underneath every step; the application requests OS/hardware readings, not individual CPU cycles.</text>

  <rect x="70" y="980" width="660" height="250" class="box"/>
  <rect x="70" y="980" width="8" height="250" fill="#8c6cff" rx="4"/>
  <text x="105" y="1020" class="label">Why pipelining improves throughput</text>
  <text x="105" y="1056" class="body">• Different instructions occupy different stages at the same time.</text>
  <text x="105" y="1086" class="body">• When one instruction waits on data, independent ready work may proceed.</text>
  <text x="105" y="1116" class="body">• Caches and prefetchers try to supply instructions/data before they are needed.</text>
  <text x="105" y="1146" class="body">• Dependencies, cache misses, and branch mispredictions can still stall or flush work.</text>
  <text x="105" y="1192" class="small">The CPU chooses these operations dynamically at hardware speed.</text>

  <rect x="770" y="980" width="670" height="250" class="box"/>
  <rect x="770" y="980" width="8" height="250" class="gold" rx="4"/>
  <text x="805" y="1020" class="label">Important distinction</text>
  <text x="805" y="1059" class="body">Prefetching brings likely-needed instructions or data closer to the CPU.</text>
  <text x="805" y="1093" class="body">Speculative execution performs predicted-path work before it is confirmed.</text>
  <line x1="805" y1="1118" x2="1400" y2="1118" class="line"/>
  <text x="805" y="1152" class="body">Applications do not manually control CPU pipeline stages or branch prediction.</text>
  <text x="805" y="1182" class="body">They can help indirectly with locality, parallel work, and avoiding needless polling.</text>
  <text x="805" y="1212" class="small">LOQ Control uses OS scheduling for telemetry; it does not force speculative work.</text>

  <rect x="70" y="1265" width="1370" height="2" fill="url(#accent)"/>
  <text x="70" y="1302" class="small">Simplified conceptual diagram · exact stages and policies vary by CPU microarchitecture</text>
</svg>
