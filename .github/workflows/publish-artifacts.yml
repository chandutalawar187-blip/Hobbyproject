name: Publish x64 artifacts

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x
      - name: Publish desktop app
        run: dotnet publish src\LenovoLoqControl\LenovoLoqControl.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts\LoqControl
      - name: Publish hardware service
        run: dotnet publish src\LenovoLoqControlService\LenovoLoqControlService.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts\LoqControlService
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: loq-control-win-x64
          path: artifacts
